<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Radio Islam Sragen</title>
    <!-- Hubungkan ke file Manifest PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1b4d3e">
    
    <!-- Pengaturan Khusus iOS/Safari PWA Standalone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        /* KUNCI TOTAL LAYAR UTAMA */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; 
            padding-top: 15vh; /* Mengangkat posisi kartu lebih naik ke atas layar */
            overflow: hidden !important; 
            position: fixed;  
            touch-action: none; 
            user-select: none;  
            box-sizing: border-box;
        }

        /* Kartu Pemutar Kustom Mewah */
        .player-card {
            background: #1e1e1e;
            padding: 35px 25px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            text-align: center;
            width: 300px;
            border-top: 5px solid #1b4d3e;
            box-sizing: border-box;
            touch-action: none; 
        }

        .logo-placeholder {
            width: 110px;
            height: 110px;
            background: #1b4d3e;
            border-radius: 50%;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            box-shadow: 0 0 25px rgba(27, 77, 62, 0.5);
        }

        .station-title {
            margin: 10px 0 5px 0;
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
        }

        .station-sub {
            margin: 0 0 35px 0;
            font-size: 14px;
            color: #888;
            letter-spacing: 0.5px;
        }
        
        /* Tombol Putar Kustom Besar */
        .btn-play {
            background: #1b4d3e;
            border: none;
            color: white;
            padding: 16px 0;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            box-shadow: 0 6px 20px rgba(27, 77, 62, 0.3);
            width: 100%;
            box-sizing: border-box;
        }
        
        .btn-play:hover { 
            background: #256b57; 
            transform: scale(1.02);
        }

        .btn-play:active {
            transform: scale(0.98);
        }
        
        .status { 
            margin-top: 25px; 
            color: #a0a0a0; 
            font-size: 14px; 
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="player-card">
    <div class="logo-placeholder">M</div>
    <h2 class="station-title">Radio Islam Sragen</h2>
    <p class="station-sub">LIVE STREAMING</p>
    
    <!-- Objek Audio Tersembunyi -->
    <audio id="audio-player" crossorigin="anonymous" preload="none"></audio>
    
    <!-- Tombol Kontrol Utama -->
    <button class="btn-play" id="play-btn">PUTAR</button>
    
    <p class="status" id="status-text">Siap mendengarkan kajian</p>
</div>

<script>
    // URL STREAMING HTTPS DIREK TANPA PORT YANG DIKUNCI KHUSUS SRAGEN
    const STREAM_URL = "https://radioislam.my.id";
    
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const statusText = document.getElementById('status-text');
    let isPlaying = false;

    playBtn.addEventListener('click', () => {
        if (!isPlaying) {
            statusText.innerText = "Menghubungkan ke server...";
            
            // Menyuntikkan URL streaming segar saat tombol diklik oleh jari user
            audio.src = STREAM_URL + "?cb=" + Date.now();
            audio.load();
            
            audio.play()
                .then(() => {
                    isPlaying = true;
                    playBtn.innerText = "HENTIKAN";
                    playBtn.style.background = "#b33939"; // Berubah merah saat live
                    playBtn.style.boxShadow = "0 6px 20px rgba(179, 57, 57, 0.3)";
                    statusText.innerText = "Memutar Audio Streaming Live";
                })
                .catch(err => {
                    statusText.innerText = "Gagal memuat siaran. Coba klik kembali.";
                    console.error("Error Audio:", err);
                });
        } else {
            audio.pause();
            audio.removeAttribute('src'); // Memutus total pemakaian kuota internet latar belakang
            audio.load();
            
            isPlaying = false;
            playBtn.innerText = "PUTAR";
            playBtn.style.background = "#1b4d3e"; // Kembali hijau semula
            playBtn.style.boxShadow = "0 6px 20px rgba(27, 77, 62, 0.3)";
            statusText.innerText = "Streaming dihentikan";
        }
    });

    // Mematikan gerakan geser layar HP
    document.addEventListener('touchmove', function(e) {
        if (e.scale !== 1) { e.preventDefault(); }
    }, { passive: false });

    // Registrasi Service Worker PWA dengan pembersihan cache berkala
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('PWA Murni Aktif Semesta!'))
                .catch(err => console.log('PWA Gagal:', err));
        });
    }
</script>
</body>
</html>
