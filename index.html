<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Islam Sragen</title>
    <!-- Hubungkan ke file Manifest PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1b4d3e">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .player-card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            width: 290px;
            border-top: 5px solid #1b4d3e;
            box-sizing: border-box;
            position: relative;
        }
        .logo-placeholder {
            width: 120px;
            height: 120px;
            background: #1b4d3e;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 0 20px rgba(27, 77, 62, 0.5);
        }
        .station-title {
            margin: 10px 0 5px 0;
            font-size: 22px;
            color: #e0e0e0;
        }
        .station-sub {
            margin: 0 0 25px 0;
            font-size: 14px;
            color: #888;
        }
        .btn-play {
            background: #1b4d3e;
            border: none;
            color: white;
            padding: 14px 40px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 100%;
            box-sizing: border-box;
        }
        .btn-play:hover { 
            background: #256b57; 
            transform: scale(1.03);
        }
        .status { 
            margin-top: 25px; 
            color: #a0a0a0; 
            font-size: 14px; 
            font-style: italic;
        }
        
        /* TRIK KHUSUS: Iframe disusutkan 1x1 piksel & transparan agar browser tetap memberi izin suara */
        .secure-audio-bridge {
            position: absolute;
            bottom: 10px;
            left: 50%;
            width: 1px;
            height: 1px;
            opacity: 0.01; /* Tidak terlihat oleh mata namun tetap aktif di sistem render */
            pointer-events: none;
            overflow: hidden;
            border: none;
        }
    </style>
</head>
<body>

<div class="player-card">
    <div class="logo-placeholder">🕌</div>
    <h2 class="station-title">Radio Islam Sragen</h2>
    <p class="station-sub">sragen.radioislam.my.id</p>
    
    <!-- Tombol depan kustom yang mewah -->
    <button class="btn-play" id="play-btn">PUTAR</button>
    
    <p class="status" id="status-text">Siap mendengarkan kajian</p>
    
    <!-- Iframe diletakkan di dalam card dengan ukuran mikro (1x1 px) -->
    <iframe 
        id="streamy-frame"
        class="secure-audio-bridge"
        src="about:blank" 
        allow="autoplay; encrypted-media">
    </iframe>
</div>

<script>
    const playBtn = document.getElementById('play-btn');
    const statusText = document.getElementById('status-text');
    const frame = document.getElementById('streamy-frame');
    
    // Alamat halaman HTTPS resmi milik Streamy Panel Anda yang memegang token validasi suara
    const STREAMY_PLAYER_PAGE = "https://radioislam.my.id";
    let isPlaying = false;

    playBtn.addEventListener('click', () => {
        if (!isPlaying) {
            statusText.innerText = "Menghubungkan ke secure server...";
            
            // Masukkan halaman resmi Streamy ke dalam jembatan mikro
            frame.src = STREAMY_PLAYER_PAGE;
            
            // Berikan waktu jeda 1.2 detik agar token termuat sempurna, lalu audio akan otomatis putar
            setTimeout(() => {
                isPlaying = true;
                playBtn.innerText = "HENTIKAN";
                playBtn.style.background = "#b33939"; // Berubah warna menjadi merah hangat
                statusText.innerText = "Memutar Audio Streaming Live";
            }, 1200);
            
        } else {
            // Putus total aliran data kuota internet dengan mengosongkan halaman iframe
            frame.src = "about:blank";
            
            isPlaying = false;
            playBtn.innerText = "PUTAR";
            playBtn.style.background = "#1b4d3e"; // Kembali ke warna hijau
            statusText.innerText = "Streaming dihentikan";
        }
    });

    // DAFTARKAN SERVICE WORKER PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('PWA Radio Islam Sragen Aktif Sempurna!'))
                .catch(err => console.log('PWA Gagal:', err));
        });
    }
</script>
</body>
</html>
