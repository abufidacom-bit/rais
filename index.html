<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Radio Islam Sragen</title>
    <!-- Hubungkan ke file Manifest PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1b4d3e">
    <!-- Pengaturan Khusus iOS/Safari PWA Standalone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        /* KUNCI TOTAL LAYAR UTAMA */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /* PERUBAHAN: Latar belakang gradasi gelap pekat dan hijau botol agar pantulan kaca putih terlihat sangat menyala */
            background: linear-gradient(145deg, #070a09 0%, #113329 60%, #1b4d3e 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 10px; /* PERUBAHAN: Menggeser tampilan hingga mentok ke atas dengan sedikit jarak */
            overflow: hidden !important;
            position: fixed;
            touch-action: none;
            user-select: none;
            box-sizing: border-box;
        }

        /* Kartu Pemutar Terkunci Presisi */
        .player-card {
            /* PERUBAHAN: Efek Glassmorphism Ekstrim (Putih 40%, Blur 35px, border tebal bersinar, & double shadow) */
            background: rgba(255, 255, 255, 0.4); 
            backdrop-filter: blur(35px) saturate(120%);
            -webkit-backdrop-filter: blur(35px) saturate(120%);
            border: 1.5px solid rgba(255, 255, 255, 0.55);
            box-shadow: 0 15px 35px 0 rgba(0, 0, 0, 0.45), inset 0 2px 4px 0 rgba(255, 255, 255, 0.3);
            
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            width: 400px;
            border-top: 5px solid #1b4d3e;
            box-sizing: border-box;
            touch-action: none;
            margin-bottom: 20px; /* Spasi antara kartu dan teks di bawahnya */
        }

        .logo-placeholder {
            width: 80px;
            height: 80px;
            background: #1b4d3e;
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Konfigurasi Font Arab Khusus */
            font-family: 'Amiri', 'Traditional Arabic', 'Segoe UI', serif;
            font-size: 26px;
            color: #ffffff;
            font-weight: bold;
            direction: rtl;
            box-shadow: 0 0 20px rgba(27, 77, 62, 0.4);
        }

        /* Teks Baris Pertama - Ukuran 25px */
        .station-title {
            margin: 5px 0;
            font-size: 25px;
            color: #ffffff; /* PERUBAHAN: Putih bersih dengan bayangan lembut agar kontras di atas kaca tebal */
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            font-weight: 600;
        }

        /* teks kedua */
        .station-sub {
            margin: 0 0 12px 0;
            font-size: 10px;
            color: #E2E8D5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 500;
        }

        /* Pembungkus Jendela (Masking / Topeng Pemotong) */
        .iframe-container {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden !important;
            
            /* PERUBAHAN: Kontras dalam kartu kaca dengan warna gelap-kaca transparan agar widget pemutar menonjol */
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            
            height: 83px;
            --crop-left: -50px;
            --crop-top: -135px;
        }

        /* Aplikasi Target yang Dibungkus */
        iframe {
            position: absolute;
            width: 480px;
            height: 445px;
            border: none;
            overflow: hidden !important;
            touch-action: none;
            left: var(--crop-left);
            top: var(--crop-top);
        }

        /* KONFIGURASI AREA TEKS BARU DI BAWAH KARTU (TINGGI TETAP 10 BARIS) */
        .info-text-container {
            width: 373px; /* Disesuaikan sama dengan lebar kartu pemutar */
            /* PERUBAHAN: Diubah dari max-height ke height agar tingginya tetap mutlak 291px */
            height: 291px; 
            overflow-y: auto; /* Memunculkan scrollbar vertikal otomatis jika teks > 10 baris */
            overflow-x: hidden;
            text-align: justify; /* Mengubah ke rata kanan-kiri agar terlihat lebih rapi */
            font-size: 17px;
            line-height: 1.5; /* 1 baris = 25.5px */
            color: #E2E8D5;
            word-wrap: break-word;
            white-space: normal;
            padding: 0 15px; /* Ditambahkan padding kanan dan kiri agar margin teks lebih lebar */
            box-sizing: border-box; /* Memastikan padding tidak merusak ukuran lebar utama */
            user-select: text;
            touch-action: pan-y;
        }

        /* Mengatur keselarasan margin paragraf agar tetap rapi */
        .info-text-container p {
            margin: 0 0 4px 0; /* Jarak antar paragraf 4px */
            /* PERUBAHAN: Memaksa baris kosong tetap memiliki tinggi 1 baris penuh (17px * 1.5 = 25.5px) */
            min-height: 25.5px; 
        }

        .info-text-container p:last-child {
            margin-bottom: 0;
        }

        /* Modifikasi tampilan scrollbar agar terlihat minimalis dan modern */
        .info-text-container::-webkit-scrollbar {
            width: 4px;
        }

        .info-text-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2); /* PERUBAHAN: Menyesuaikan scrollbar bertema kaca murni */
            border-radius: 10px;
        }

        /* Gaya Khusus untuk Teks Tambahan @dev.afcom */
        .dev-tag {
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5); /* PERUBAHAN: Disesuaikan agar terbaca jelas di background gelap baru */
            margin-top: 15px;
            width: 373px;
            font-weight: 500;
            letter-spacing: 0.5px;
            user-select: none;
        }
    </style>
</head>
<body>

    <!-- Kartu Pemutar Utama -->
    <div class="player-card">
        <div class="logo-placeholder">رَائِس</div>
        <h2 class="station-title">Radio Islam Sragen</h2>
        <p class="station-sub">Lantunan Murotal dan Kajian Islam Ilmiah</p>
        <div class="iframe-container">
            <iframe src="https://streamy1.radioislam.my.id/player/sragen-s-station/" allow="autoplay; encrypted-media" scrolling="no" title="Streamy Player"></iframe>
        </div>
    </div>

    <!-- AREA TEKS DI BAWAH KARTU PEMUTAR (Tinggi dikunci pas maks 10 baris kalimat tunggal) -->
    <div class="info-text-container">
        <p>Jadwal kajian islam ilmiyah</p>
        <p>di plupuh dan sekitarnya</p>
        <p></p> <!-- Baris kosong ke-3 (tetap memakan ruang tinggi) -->
        <p></p> <!-- Baris kosong ke-4 -->
        <p></p> <!-- Baris kosong ke-5 -->
        <p></p> <!-- Baris kosong ke-6 -->
        <p></p> <!-- Baris kosong ke-7 -->
        <p></p> <!-- Baris kosong ke-8 -->
        <p></p> <!-- Baris kosong ke-9 -->
        <p>Baris ke-10 teks simulasi</p>
    </div>

    <!-- TEKS BARU @dev.afcom -->
    <div class="dev-tag">
        @dev.afcom
    </div>

    <script>
        // Mengizinkan scroll internal hanya untuk kontainer teks bawah agar PWA tidak kaku
        document.addEventListener('touchmove', function(e) {
            if (e.target.closest('.info-text-container')) {
                return;
            }
            if (e.scale !== 1) {
                e.preventDefault();
            }
        }, { passive: false });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('PWA Manual Crop Sukses Diaktifkan!'))
                    .catch(err => console.log('PWA Gagal:', err));
            });
        }
    </script>
</body>
</html>
