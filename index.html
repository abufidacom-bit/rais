<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Islam Indonesia - PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1E3A8A">
    <!-- Pustaka Ikon Pihak Ketiga jika diperlukan -->
    <style>
        body { font-family: sans-serif; background: #f3f4f6; text-align: center; padding: 20px; }
        .player-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 400px; margin: 40px auto; }
        .btn { background: #1e3a8a; color: white; border: none; padding: 15px 30px; border-radius: 50px; font-size: 18px; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn:hover { background: #1d4ed8; }
        .status { margin-top: 15px; color: #6b7280; font-size: 14px; }
    </style>
</head>
<body>

    <div class="player-card">
        <h2>Radio Islam Indonesia</h2>
        <p id="stream-info">Menyiarkan Kajian Islam Ilmiah</p>
        
        <!-- Elemen Audio Utama -->
        <audio id="riiAudio" src="http://radioislam.my.id" preload="none"></audio>
        
        <button id="playBtn" class="btn">▶ PUTAR RADIO</button>
        <div id="statusLabel" class="status">Status: Berhenti</div>
    </div>

    <script>
        const audio = document.getElementById('riiAudio');
        const playBtn = document.getElementById('playBtn');
        const statusLabel = document.getElementById('statusLabel');

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                // Untuk mencegah lag pemuatan cache audio lama, kita re-load source streaming-nya saat play diklik
                audio.load(); 
                audio.play()
                    .then(() => {
                        playBtn.innerText = "⏸ BERHENTIKAN";
                        statusLabel.innerText = "Status: Menyiarkan...";
                    })
                    .catch(err => {
                        statusLabel.innerText = "Gagal memutar. Pastikan koneksi aktif.";
                        console.error(err);
                    });
            } else {
                audio.pause();
                playBtn.innerText = "▶ PUTAR RADIO";
                statusLabel.innerText = "Status: Berhenti";
            }
        });

        // Mendaftarkan Service Worker PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker terdaftar!', reg.scope))
                    .catch(err => console.log('Gagal mendaftarkan Service Worker', err));
            });
        }
    </script>
</body>
</html>
