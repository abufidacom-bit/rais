<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Radio Islam Sragen</title>
    <!-- Hubungkan ke file Manifest PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1b4d3e">
    <!-- Pengaturan Khusus iOS/Safari PWA Standalone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        /* KUNCI TOTAL LAYAR UTAMA */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 10px;
            overflow: hidden !important;
            position: fixed;
            touch-action: none;
            user-select: none;
            box-sizing: border-box;
        }
        /* Kartu Pemutar Terkunci Presisi */
        .player-card {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            width: 400px;
            border-top: 5px solid #1b4d3e;
            box-sizing: border-box;
            touch-action: none;
            margin-bottom: 20px;
        }
        .logo-placeholder {
            width: 80px;
            height: 80px;
            background: #1b4d3e;
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Amiri', 'Traditional Arabic', 'Segoe UI', serif;
            font-size: 26px;
            color: #ffffff;
            font-weight: bold;
            direction: rtl;
            box-shadow: 0 0 20px rgba(27, 77, 62, 0.4);
        }
        .station-title {
            margin: 5px 0;
            font-size: 25px;
            color: #E2E8D5;
            font-weight: 600;
        }
        .station-sub {
            margin: 0 0 12px 0;
            font-size: 10px;
            color: #E2E8D5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 500;
        }
        .iframe-container {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden !important;
            background: #151515;
            border: 1px solid #2d2d2d;
            height: 83px;
            --crop-left: -50px;
            --crop-top: -135px;
        }
        iframe {
            position: absolute;
            width: 480px;
            height: 445px;
            border: none;
            overflow: hidden !important;
            touch-action: none;
            left: var(--crop-left);
            top: var(--crop-top);
        }
        /* KONFIGURASI AREA TEKS BARU DI BAWAH KARTU (MAKSIMAL 10 BARIS) */
        .info-text-container {
            width: 373px;
            max-height: 350px;
            overflow-y: auto;
            overflow-x: hidden;
            text-align: justify;
            font-size: 17px;
            line-height: 1.5;
            color: #E2E8D5;
            word-wrap: break-word;
            white-space: normal;
            padding: 0 15px;
            box-sizing: border-box;
            user-select: text;
            touch-action: pan-y;
        }
        .info-text-container::-webkit-scrollbar {
            width: 4px;
        }
        .info-text-container::-webkit-scrollbar-thumb {
            background: #2d2d2d;
            border-radius: 10px;
        }
        .loading-text {
            color: #888888;
            font-style: italic;
            font-size: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Kartu Pemutar Utama -->
    <div class="player-card">
        <div class="logo-placeholder">رَائِس</div>
        <h2 class="station-title">Radio Islam Sragen</h2>
        <p class="station-sub">Lantunan Murotal dan Kajian Islam Ilmiah</p>
        <div class="iframe-container">
            <iframe src="https://radioislam.my.id" allow="autoplay; encrypted-media" scrolling="no" title="Streamy Player"></iframe>
        </div>
    </div>

    <!-- AREA TEKS DI BAWAH KARTU PEMUTAR -->
    <div class="info-text-container" id="info-text">
        <div class="loading-text">Memuat informasi terbaru...</div>
    </div>

    <script>
        // Menggunakan ID Google Spreadsheet milik Anda
        const SPREADSHEET_ID = '1Z2v5GkZaNVr3WqJS-g1Tw3-fnvzklUoTa9e1MLJaCiM';
        const SHEET_NAME = 'Sheet1'; 
        
        // PEMBERSIHAN KODE: Menambahkan &headers=0 agar baris pertama dibaca sebagai teks biasa, bukan kepala tabel.
        const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}&headers=0`;

        async function fetchInfoText() {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network error');
                
                const text = await response.text();
                
                // Proses pemotongan teks respons agar mendapatkan format JSON murni
                const startPos = text.indexOf('{');
                const endPos = text.lastIndexOf('}');
                if (startPos === -1 || endPos === -1) throw new Error('Invalid JSON format');
                
                const jsonText = text.substring(startPos, endPos + 1);
                const data = JSON.parse(jsonText);
                
                let infoText = "";

                // Metode Cek Fleksibel: Cek kolom header dahulu, jika kosong cek baris pertama data
                if (data.table.cols && data.table.cols[0] && data.table.cols[0].label) {
                    infoText = data.table.cols[0].label;
                } else if (data.table.rows && data.table.rows[0] && data.table.rows[0].c && data.table.rows[0].c[0]) {
                    infoText = data.table.rows[0].c[0].v;
                }

                // Jika berhasil mendapatkan teks, tampilkan ke layar
                if (infoText && infoText.trim() !== "") {
                    document.getElementById('info-text').innerText = infoText;
                } else {
                    document.getElementById('info-text').innerHTML = "<span style='color:#888; font-size:14px; display:block; text-align:center;'>Kotak A1 di Google Sheets masih kosong. Silakan isi teks terlebih dahulu.</span>";
                }
                
            } catch (error) {
                console.error('Error detail:', error);
                document.getElementById('info-text').innerHTML = "<span style='color:#ff6b6b; font-size:14px; display:block; text-align:center;'>Gagal memuat informasi.<br><small style='color:#aaa;'>Pastikan tab bernama 'Sheet1' dan sudah disetel publik.</small></span>";
            }
        }

        window.addEventListener('DOMContentLoaded', fetchInfoText);

        document.addEventListener('touchmove', function(e) {
            if (e.target.closest('.info-text-container')) {
                return;
            }
            if (e.scale !== 1) {
                e.preventDefault();
            }
        }, { passive: false });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('PWA Manual Crop Sukses Diaktifkan!'))
                    .catch(err => console.log('PWA Gagal:', err));
            });
        }
    </script>
</body>
</html>
