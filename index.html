<!DOCTYPE html>
<html lang="id">
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"> 
    <title>Radio Islam Sragen</title> 
    <!-- Hubungkan ke file Manifest PWA --> 
    <link rel="manifest" href="manifest.json"> 
    <meta name="theme-color" content="#1b4d3e"> 
    <!-- Pengaturan Khusus iOS/Safari PWA Standalone --> 
    <meta name="apple-mobile-web-app-capable" content="yes"> 
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> 
    <style> 
        /* KUNCI TOTAL LAYAR UTAMA */ 
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #121212; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            padding-top: 4vh; 
            overflow: hidden !important; 
            position: fixed; 
            touch-action: none; 
            user-select: none; 
            box-sizing: border-box; 
        } 
        /* Kartu Pemutar Terkunci Presisi */ 
        .player-card { 
            background: #1e1e1e; 
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            text-align: center; 
            width: 340px; 
            border-top: 5px solid #1b4d3e; 
            box-sizing: border-box; 
            touch-action: none; 
        } 
        /* Ukuran Logo Diperbesar */
        .logo-placeholder { 
            width: 110px;         
            height: 110px;       
            background: #1b4d3e; 
            border-radius: 50%; 
            margin: 5px auto 15px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 48px;     
            box-shadow: 0 0 20px rgba(27, 77, 62, 0.4); 
        } 
        /* Jarak Judul Disesuaikan */
        .station-title { 
            margin: 5px 0 22px 0; 
            font-size: 22px; 
            color: #e0e0e0; 
        } 
        
        /* 1. KUNCI UKURAN BINGKAI LUAR (IFRAME CONTAINER) */ 
        .iframe-container { 
            position: relative; 
            width: 288px;              /* Mengunci lebar absolut bingkai luar */
            height: 83px;              /* Mengunci tinggi absolut hasil crop */
            max-width: 288px !important;
            max-height: 83px !important;
            min-width: 288px !important;
            min-height: 83px !important;
            border-radius: 12px; 
            overflow: hidden !important; 
            background: #151515; 
            border: 1px solid #2d2d2d; 
            margin: 0 auto;            /* Memastikan posisi bingkai tetap di tengah kartu */

            /* ======================================================= */
            /* PENGATURAN CROP MANUAL (UBAH ANGKA DI BAWAH INI)        */
            /* ======================================================= */
            --crop-left: -50px;  
            --crop-top: -135px;  
            /* ======================================================= */
        } 
        
        /* 2. KUNCI UKURAN APLIKASI YANG DIBUNGKUS (IFRAME TARGET) */ 
        iframe { 
            position: absolute; 
            width: 440px !important;     /* Mengunci resolusi lebar asli aplikasi */
            height: 445px !important;    /* Mengunci resolusi tinggi asli aplikasi */
            max-width: 440px !important;
            max-height: 445px !important;
            min-width: 440px !important;
            min-height: 445px !important;
            border: none; 
            overflow: hidden !important; 
            touch-action: none; 
            pointer-events: auto;        /* Memastikan tombol internal player tetap dapat diklik */
            
            /* Posisi pergeseran topeng pembungkus */
            left: var(--crop-left);
            top: var(--crop-top);
        } 
    </style>
</head>
<body>
    <div class="player-card"> 
        <div class="logo-placeholder">🇲🇨</div> 
        <h2 class="station-title">Radio Islam Sragen</h2> 
        
        <!-- Wadah Iframe dengan Ukuran yang Terkunci Mutlak --> 
        <div class="iframe-container"> 
            <iframe src="https://radioislam.my.id" allow="autoplay; encrypted-media" scrolling="no" title="Streamy Player"> </iframe> 
        </div> 
    </div>

    <script> 
        document.addEventListener('touchmove', function(e) { 
            if (e.scale !== 1) { e.preventDefault(); } 
        }, { passive: false }); 

        if ('serviceWorker' in navigator) { 
            window.addEventListener('load', () => { 
                navigator.serviceWorker.register('sw.js') 
                    .then(reg => console.log('PWA Manual Crop Sukses Diaktifkan!')) 
                    .catch(err => console.log('PWA Gagal:', err)); 
            }); 
        }
    </script>
</body>
</html>
