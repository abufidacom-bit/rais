<!DOCTYPE html>
<html lang="id">
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"> 
    <title>Radio Islam Sragen</title> 
    <!-- Hubungkan ke file Manifest PWA --> 
    <link rel="manifest" href="manifest.json"> 
    <meta name="theme-color" content="#1b4d3e"> 
    
    <!-- Tautan Ikon untuk Dukungan Apple iOS Safari Launcher -->
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
    
    <!-- Pengaturan Khusus PWA Standalone --> 
    <meta name="apple-mobile-web-app-capable" content="yes"> 
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> 
    <style> 
        /* PERBAIKAN UTAMA: Melepas fungsi rigid fixed agar server AzuraCast mau merender player */ 
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #121212; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; /* Kembali ke posisi tengah seimbang */
            overflow: hidden !important; /* Menghapus bar scroll luar */ 
        } 
        
        /* Kartu Pemutar yang Mengunci Konten Dalam */ 
        .player-card { 
            background: #1e1e1e; 
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            text-align: center; 
            width: 340px; 
            border-top: 5px solid #1b4d3e; 
            box-sizing: border-box; 
        } 
        
        /* Wadah Lingkaran Asli dengan Efek Potong Bulat */
        .logo-placeholder { 
            width: 80px; 
            height: 80px; 
            background: #1b4d3e; 
            border-radius: 50%; 
            margin: 0 auto 12px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            box-shadow: 0 0 20px rgba(27, 77, 62, 0.4); 
            overflow: hidden; 
        } 
        
        .logo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .station-title { 
            margin: 5px 0; 
            font-size: 22px; 
            color: #e0e0e0; 
        } 
        
        .station-sub { 
            margin: 0 0 15px 0; 
            font-size: 13px; 
            color: #888; 
        } 
        
        /* Pembungkus Frame: Tetap Berukuran Lapang 320px */ 
        .iframe-container { 
            width: 100%; 
            height: 320px; 
            border-radius: 12px; 
            overflow: hidden !important; 
            background: #151515; 
            border: 1px solid #2d2d2d; 
            position: relative; 
        } 
        
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            overflow: hidden !important; 
        } 
    </style>
</head>
<body>
    <div class="player-card"> 
        <div class="logo-placeholder">
            <img src="icon-192.png" alt="Logo" onerror="this.src='icon-512.png'">
        </div> 
        <h2 class="station-title">Radio Islam Sragen</h2> 
        <p class="station-sub">sragen.radioislam.my.id</p> 
        <div class="iframe-container"> 
            <iframe src="https://radioislam.my.id" allow="autoplay; encrypted-media" scrolling="no" title="Streamy Player"> </iframe> 
        </div> 
    </div>

    <script> 
        // Hanya mematikan efek zoom Cubit Jari agar aplikasi tidak rusak layoutnya
        document.addEventListener('touchmove', function(e) { 
            if (e.scale !== 1) { e.preventDefault(); } 
        }, { passive: false }); 

        // DAFTARKAN SERVICE WORKER PWA 
        if ('serviceWorker' in navigator) { 
            window.addEventListener('load', () => { 
                navigator.serviceWorker.register('sw.js') 
                    .then(reg => console.log('PWA Pemutar Aktif Kembali!')) 
                    .catch(err => console.log('PWA Gagal:', err)); 
            }); 
        }
    </script>
</body>
</html>
