<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Radio Islam Sragen</title>
    <!-- Hubungkan ke file Manifest PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <!-- Pengaturan Khusus iOS/Safari PWA Standalone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        /* KUNCI TOTAL LAYAR UTAMA */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /* TETAP: Latar belakang hitam pekat total */
            background: #000000 !important;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 10px; 
            overflow: hidden !important;
            position: fixed;
            touch-action: none;
            user-select: none;
            box-sizing: border-box;
        }

        /* Kartu Pemutar Terkunci Presisi */
        .player-card {
            /* PERBAIKAN: Menyesuaikan opasitas kaca agar app radio di dalamnya tidak terblokir visualnya */
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            
            /* Garis tepi warna emas putih terang untuk efek kaca menyala */
            border: 1px solid rgba(255, 255, 244, 0.4);
            padding: 25px;
            border-radius: 20px;
            
            /* Pendaran bayangan di latar belakang hitam */
            box-shadow: 
                inset 0 1px 2px rgba(255, 255, 255, 0.4), 
                0 15px 35px rgba(0, 0, 0, 0.9), 
                0 0 15px 1px rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 400px;
            
            /* Border bagian atas dengan aksen Luxury Gold */
            border-top: 5px solid #CAA347;
            box-sizing: border-box;
            touch-action: none;
            margin-bottom: 20px; 
        }

        .logo-placeholder {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #FFDF92 0%, #CAA347 100%);
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Amiri', 'Traditional Arabic', 'Segoe UI', serif;
            font-size: 26px;
            color: #1e1b15;
            font-weight: bold;
            direction: rtl;
            box-shadow: 0 0 20px rgba(202, 163, 71, 0.4);
        }

        /* Teks Baris Pertama - Ukuran 25px */
        .station-title {
            margin: 5px 0;
            font-size: 25px;
            color: #FFFFF4;
            font-weight: 600;
        }

        /* teks kedua */
        .station-sub {
            margin: 0 0 12px 0;
            font-size: 10px;
            color: #EDDDB8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 500;
        }

        /* Pembungkus Jendela (Masking / Topeng Pemotong) */
        .iframe-container {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden !important;
            
            /* PERBAIKAN: Menggunakan background transparan penuh agar app player asli dari streamy1 kelihatan sempurna */
            background: transparent !important;
            border: 1px solid rgba(255, 255, 254, 0.3);
            
            height: 83px;
            --crop-left: -50px;
            --crop-top: -135px;
        }

        /* Aplikasi Target yang Dibungkus */
        iframe {
            position: absolute;
            width: 480px;
            height: 445px;
            border: none;
            overflow: hidden !important;
            touch-action: none;
            left: var(--crop-left);
            top: var(--crop-top);
            /* PERBAIKAN: Memastikan urutan tumpukan iframe berada paling depan */
            z-index: 5;
        }

        /* KONFIGURASI AREA TEKS DI BAWAH KARTU */
        .info-text-container {
            width: 373px; 
            height: 352px;
            overflow-y: auto; 
            overflow-x: hidden;
            text-align: justify; 
            font-size: 16px;
            line-height: 1.3; 
            color: #FFFFF4;
            word-wrap: break-word;
            white-space: normal;
            padding: 0 15px; 
            box-sizing: border-box; 
            user-select: text;
            touch-action: pan-y;
        }

        .info-text-container p {
            margin: 0 0 4px 0; 
            min-height: 20.8px;
        }

        .info-text-container p:last-child {
            margin-bottom: 0;
        }

        .info-text-container::-webkit-scrollbar {
            width: 4px;
        }

        .info-text-container::-webkit-scrollbar-thumb {
            background: #CAA347;
            border-radius: 10px;
        }

        .dev-tag {
            text-align: center;
            font-size: 13px;
            color: #EDDDB8;
            margin-top: 15px;
            width: 373px;
            font-weight: 400;
            letter-spacing: 0.5px;
            user-select: none;
        }
    </style>
</head>
<body>

    <!-- Kartu Pemutar Utama -->
    <div class="player-card">
        <div class="logo-placeholder">رَائِس</div>
        <h2 class="station-title">Radio Islam Sragen</h2>
        <p class="station-sub">Lantunan Murotal dan Kajian Islam Ilmiah</p>
        
        <div class="iframe-container" style="margin-bottom: 20px;">
            <iframe src="https://radioislam.my.id" allow="autoplay; encrypted-media" scrolling="no" title="Streamy Player"></iframe>
        </div>

        <!-- AREA TEKS SEKARANG DI MASUKKAN KE DALAM KARTU PEMUTAR BAGIAN BAWAH -->
        <div class="info-text-container">
            <p>══════📻🆁🅰🅸🆂</p>
            <p></p>
            <p>📚 Qasidah</p>
            <p>   Unwanulhikam</p>
            <p>🎙 Al-Ustadz&nbsp; Usamah&nbsp; bin</p>
            <p>   Faishol Mahri&nbsp; حفظه ا لله</p>
            <p></p>
            <p>📚 Tausiyah</p>
            <p>🎙 Al-Ustadz Huda حفظه ا لله</p>
            <p></p>            
            <p>📌 Masjid Alfalah,&nbsp;Sragen</p>
            <p>   Ahad Tgl 20 Juli  2025</p>
            <p></p>
            <p></p>
        </div>

        <div class="dev-tag">
            dev.@fcom
        </div>
    </div>

    <script>
        document.addEventListener('touchmove', function(e) {
            if (e.target.closest('.info-text-container')) {
                return;
            }
            if (e.scale !== 1) {
                e.preventDefault();
            }
        }, { passive: false });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('PWA Manual Crop Sukses Diaktifkan!'))
                    .catch(err => console.log('PWA Gagal:', err));
            });
        }
    </script>
</body>
</html>
