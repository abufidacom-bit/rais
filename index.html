<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Radio Islam Sragen</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1b4d3e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0e0e0e 0%, #1b4d3e 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 10px; 
            overflow: hidden !important;
            position: fixed;
            touch-action: none;
            user-select: none;
            box-sizing: border-box;
        }

        .player-card {
            background: 
                linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.08) 40%, rgba(255, 255, 255, 0.35) 45%, rgba(255, 255, 255, 0.05) 52%, rgba(255, 255, 255, 0.15) 100%),
                rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 244, 0.6);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 
                inset 0 1px 2px rgba(255, 255, 255, 0.6),
                inset 0 -1px 2px rgba(255, 255, 255, 0.2),
                0 10px 25px rgba(0,0,0,0.5),
                0 0 18px 2px rgba(255, 255, 255, 0.18);
            text-align: center;
            width: 360px;
            border-top: 5px solid #CAA347;
            box-sizing: border-box;
            touch-action: none;
            margin-bottom: 20px; 
        }

        .logo-placeholder {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #FFDF92 0%, #CAA347 100%);
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Amiri', 'Traditional Arabic', 'Segoe UI', serif;
            font-size: 26px;
            color: #1e1b15;
            font-weight: bold;
            direction: rtl;
            box-shadow: 0 0 20px rgba(202, 163, 71, 0.4);
        }

        .station-title {
            margin: 5px 0;
            font-size: 25px;
            color: #FFFFF4;
            font-weight: 600;
        }

        .station-sub {
            margin: 0 0 12px 0;
            font-size: 10px;
            color: #EDDDB8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 500;
        }

        .iframe-container {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden !important;
            background: transparent !important;
            border: 1px solid rgba(255, 255, 254, 0.4);
            height: 83px;
            --crop-left: -50px;
            --crop-top: -135px;
        }

        iframe {
            position: absolute;
            width: 480px;
            height: 440px;
            border: none;
            overflow: hidden !important;
            left: var(--crop-left);
            top: var(--crop-top);
            z-index: 5;
            /* MEMASTIKAN sentuhan jari tembus langsung ke tombol play di Android */
            pointer-events: auto !important;
            touch-action: auto !important;
        }

        .info-text-container {
            width: 333px; 
            height: 352px;
            overflow-y: auto; 
            overflow-x: hidden;
            text-align: justify; 
            font-size: 16px;
            line-height: 1.3; 
            color: #FFFFF4;
            word-wrap: break-word;
            white-space: normal;
            padding: 0 15px; 
            box-sizing: border-box; 
            user-select: text;
            touch-action: pan-y;
        }

        .info-text-container p {
            margin: 0 0 4px 0; 
            min-height: 20.8px;
        }

        .info-text-container p:last-child {
            margin-bottom: 0;
        }

        .info-text-container::-webkit-scrollbar {
            width: 4px;
        }

        .info-text-container::-webkit-scrollbar-thumb {
            background: #CAA347;
            border-radius: 10px;
        }

        .dev-tag {
            text-align: center;
            font-size: 13px;
            color: #EDDDB8;
            margin-top: 15px;
            width: 333px;
            font-weight: 400;
            letter-spacing: 0.5px;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="logo-placeholder">رَائِس</div>
        <h2 class="station-title">Radio Islam Sragen</h2>
        <p class="station-sub">Lantunan Murotal dan Kajian Islam Ilmiah</p>
        
        <div class="iframe-container" style="margin-bottom: 20px;">
            <!-- PERBAIKAN: Menambahkan hak akses penuh fitur audio streaming agar suara tidak diblokir sistem -->
            <iframe src="https://radioislam.my.id" allow="autoplay; encrypted-media; picture-in-picture" scrolling="no" title="Streamy Player"></iframe>
        </div>

        <div class="info-text-container">
            <!-- UBAH DISINI -->
            <p>══════📻🆁🅰🅸🆂</p>
            <p></p>
            <p>📚 Qasidah</p>
            <p>   Unwanulhikam</p>
            <p>🎙 Al-Ustadz&nbsp; Usamah&nbsp; bin</p>
            <p>   Faishol Mahri&nbsp; حفظه ا لله</p>
            <p></p>
            <p>📚 Tausiyah</p>
            <p>🎙 Al-Ustadz Huda حفظه ا لله</p>
            <p></p>            
            <p>📌 Masjid Alfalah,&nbsp;Sragen</p>
            <p>   Ahad Tgl 20 Juli  2025</p>
            <p></p>
            <p></p>
            <!-- UBAH DISINI -->
        </div>

        <div class="dev-tag">
            dev.@fcom
        </div>
    </div>

    <script>
        document.addEventListener('touchmove', function(e) {
            if (e.target.closest('.info-text-container') || e.target.closest('iframe')) {
                return;
            }
            if (e.scale !== 1) {
                e.preventDefault();
            }
        }, { passive: false });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('PWA Manual Crop Sukses Diaktifkan!'))
                    .catch(err => console.log('PWA Gagal:', err));
            });
        }
    </script>
</body>
</html>
