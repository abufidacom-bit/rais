<!DOCTYPE html>
<html lang="id">
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"> 
    <title>Radio Islam Sragen</title> 
    <!-- Hubungkan ke file Manifest PWA --> 
    <link rel="manifest" href="manifest.json"> 
    <meta name="theme-color" content="#1b4d3e"> 
    
    <!-- Pengaturan Khusus iOS/Safari PWA Standalone --> 
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
    <meta name="apple-mobile-web-app-capable" content="yes"> 
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> 
    <style> 
        /* KUNCI TOTAL LAYAR UTAMA: Mencegah halaman ditarik/digeser ke atas-bawah oleh jari */ 
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #121212; /* Mengikuti warna dasar gelap asli Streamy */
            overflow: hidden !important; /* Menghapus bar scroll secara mutlak */ 
            position: fixed; /* Mengunci posisi layar dari efek bounce elastis iOS */ 
            touch-action: none; /* Mematikan semua gerakan geser jari pada latar belakang */ 
            user-select: none; /* Mencegah teks terblok secara tidak sengaja */ 
            box-sizing: border-box; 
        } 
        
        /* Kontainer Utama Pengisi Layar Penuh Tanpa Jarak */
        .app-container {
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
        }

        /* Memaksa Iframe Mengisi Seluruh Layar Aplikasi PWA */ 
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block;
            overflow: hidden !important; 
        } 
    </style>
</head>
<body>
    <div class="app-container"> 
        <!-- Memuat Halaman HTTPS Resmi Streamy Anda Secara Utuh Tanpa Modifikasi Parameter --> 
        <iframe 
            src="https://radioislam.my.id" 
            allow="autoplay; encrypted-media" 
            title="Radio Islam Sragen Live Player"> 
        </iframe> 
    </div>

    <script> 
        // Mematikan efek geser elastis (overscroll) di webview seluler secara paksa via JavaScript 
        document.addEventListener('touchmove', function(e) { 
            if (e.scale !== 1) { e.preventDefault(); } 
        }, { passive: false }); 

        // DAFTARKAN SERVICE WORKER PWA AGAR BISA DIINSTAL DI HP 
        if ('serviceWorker' in navigator) { 
            window.addEventListener('load', () => { 
                navigator.serviceWorker.register('sw.js') 
                    .then(reg => console.log('PWA Full Wrapper Sukses Aktif!')) 
                    .catch(err => console.log('PWA Gagal:', err)); 
            }); 
        }
    </script>
</body>
</html>
