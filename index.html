<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Radio Islam Sragen</title>
    
    <!-- Hubungkan ke file Manifest PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1b4d3e">
    
    <!-- Pengaturan Khusus iOS/Safari PWA Standalone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Radio Sragen">
    
    <!-- Ikon untuk iOS -->
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <style>
        /* KUNCI TOTAL LAYAR UTAMA */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 6vh; /* Memberi ruang aman untuk status bar HP */
            overflow: hidden !important;
            position: fixed;
            touch-action: none;
            user-select: none;
            box-sizing: border-box;
        }

        /* Kartu Pemutar Utama */
        .player-card {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            width: 340px; 
            border-top: 5px solid #1b4d3e;
            box-sizing: border-box;
            touch-action: none;
        }

        .logo-placeholder {
            width: 80px;
            height: 80px;
            background: #1b4d3e;
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 0 20px rgba(27, 77, 62, 0.4);
        }

        .station-title {
            margin: 5px 0;
            font-size: 22px;
            color: #e0e0e0;
        }

        .station-sub {
            margin: 0 0 15px 0;
            font-size: 13px;
            color: #888;
        }

        /* Pembungkus Jendela (Bingkai Pemotong) */
        .iframe-container {
            width: 100%;
            height: 380px; 
            border-radius: 12px;
            overflow: hidden !important;
            background: #151515;
            border: 1px solid #2d2d2d;
            position: relative;
            
            /* UBAH ANGKA DI BAWAH INI UNTUK MENGATUR SKALA SECARA MANUAL */
            --player-scale: 0.85; 
        }

        /* Mengunci Pergerakan dan Mengatur Skala di Dalam Iframe */
        iframe {
            position: absolute;
            width: calc(100% / var(--player-scale));
            height: calc(100% / var(--player-scale));
            top: 50%;
            left: 50%;
            border: none;
            overflow: hidden !important;
            touch-action: none;
            transform: translate(-50%, -50%) scale(var(--player-scale));
            transform-origin: center center;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="logo-placeholder">🇲🇨</div>
        <h2 class="station-title">Radio Islam Sragen</h2>
        <p class="station-sub">sragen.radioislam.my.id</p>
        
        <div class="iframe-container">
            <iframe src="https://radioislam.my.id" allow="autoplay; encrypted-media" scrolling="no" title="Streamy Player">
            </iframe>
        </div>
    </div>

    <script>
        // Mencegah bounce scroll bawaan iOS Safari
        document.addEventListener('touchmove', function(e) {
            if (e.scale !== 1) { e.preventDefault(); }
        }, { passive: false });

        // Registrasi Service Worker agar web bisa diinstal ke HP
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('PWA Mandiri Berhasil Aktif!'))
                .catch(err => console.log('PWA Gagal:', err));
            });
        }
    </script>
</body>
</html>
