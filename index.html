<script>
    // URL PEMUTAR RESMI BAWAAN SERVER SHOUTCAST RII
    // Menggunakan halaman index resmi Shoutcast agar server memberikan izin streaming penuh ke browser
    const SHOUTCAST_PLAYER_URL = "http://radioislam.my.id"; 
    
    const playBtn = document.getElementById('play-btn');
    const statusText = document.getElementById('status-text');
    
    let radioWindow = null;
    let isPlaying = false;

    playBtn.addEventListener('click', () => {
        if (!isPlaying) {
            statusText.innerText = "Menghubungkan ke pemutar server...";
            
            // Pengaturan dimensi ukuran widget pop-up (layar mini)
            const windowFeatures = "width=420,height=280,resizable=no,scrollbars=no,status=no,menubar=no,toolbar=no";
            
            // Membuka pemutar resmi Shoutcast di jendela terpisah untuk bypass mixed-content HTTPS
            radioWindow = window.open(SHOUTCAST_PLAYER_URL, "RadioIslamSragenOfficialPlayer", windowFeatures);
            
            if (radioWindow) {
                isPlaying = true;
                playBtn.innerText = "HENTIKAN";
                playBtn.style.background = "#b33939"; // Mengubah tombol menjadi merah hangat
                statusText.innerText = "Menyiarkan Audio Live (Jendela Aktif)";
            } else {
                statusText.innerText = "Gagal. Mohon centang 'IZINKAN POP-UP' pada browser Anda.";
            }
            
        } else {
            // Menutup jendela widget pemutar secara otomatis saat tombol HENTIKAN diklik di PWA
            if (radioWindow) {
                radioWindow.close();
            }
            resetPlayerState();
        }
    });

    function resetPlayerState() {
        isPlaying = false;
        playBtn.innerText = "PUTAR";
        playBtn.style.background = "#1b4d3e"; // Kembali ke warna hijau gelap semula
        statusText.innerText = "Streaming dihentikan";
    }

    // Pemantauan otomatis: jika pendengar menutup widget kecil secara manual, tombol PWA langsung kembali ke mode "PUTAR"
    setInterval(() => {
        if (isPlaying && radioWindow && radioWindow.closed) {
            resetPlayerState();
        }
    }, 1500);

    // DAFTARKAN SERVICE WORKER PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('PWA Terdaftar Sukses!'))
                .catch(err => console.log('PWA Offline Error', err));
        });
    }
</script>
