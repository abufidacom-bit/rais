<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Radio Islam Sragen</title>
    <!-- Hubungkan ke file Manifest PWA -->
    <link rel="manifest" href="manifest.json">
    <!-- DIUBAH: Mengubah warna tema status bar mobile Android/iOS menjadi hitam pekat -->
    <meta name="theme-color" content="#000000">
    <!-- Pengaturan Khusus iOS/Safari PWA Standalone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        /* KUNCI TOTAL LAYAR UTAMA */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /* DIUBAH: Latar belakang halaman sekarang menggunakan warna hitam pekat total (Pure Black) */
            background: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 10px; 
            overflow: hidden !important;
            position: fixed;
            touch-action: none;
            user-select: none;
            box-sizing: border-box;
        }

        /* Kartu Pemutar Terkunci Presisi */
        .player-card {
            /* Menggunakan kombinasi kaca putih menyala tebal */
            background: rgba(255, 255, 255, 0.32);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            
            /* Garis tepi warna emas putih terang untuk memberikan efek potongan kaca yang tegas */
            border: 1px solid rgba(255, 255, 244, 0.6);
            padding: 25px;
            border-radius: 20px;
            
            /* Menambahkan efek pantulan cahaya dalam (inset) dan pendaran luar putih (glow) */
            box-shadow: 
                inset 0 1px 2px rgba(255, 255, 255, 0.5), 
                0 15px 35px rgba(0, 0, 0, 0.8), 
                0 0 15px 1px rgba(255, 255, 255, 0.15);
            text-align: center;
            width: 400px;
            
            /* Border bagian atas dengan aksen Luxury Gold */
            border-top: 5px solid #CAA347;
            box-sizing: border-box;
            touch-action: none;
            margin-bottom: 20px; 
        }

        .logo-placeholder {
            width: 80px;
            height: 80px;
            /* Aksen dasar logo menggunakan paduan warna emas padat */
            background: linear-gradient(135deg, #FFDF92 0%, #CAA347 100%);
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Amiri', 'Traditional Arabic', 'Segoe UI', serif;
            font-size: 26px;
            /* Teks huruf arab berwarna gelap agar kontras di atas emas */
            color: #1e1b15;
            font-weight: bold;
            direction: rtl;
            /* Pendaran bayangan emas di sekeliling logo */
            box-shadow: 0 0 20px rgba(202, 163, 71, 0.4);
        }

        /* Teks Baris Pertama - Ukuran 25px */
        .station-title {
            margin: 5px 0;
            font-size: 25px;
            /* Warna teks judul menggunakan warna White Gold terang */
            color: #FFFFF4;
            font-weight: 600;
        }

        /* teks kedua */
        .station-sub {
            margin: 0 0 12px 0;
            font-size: 10px;
            /* Warna sub-teks menggunakan warna emas redup halus */
            color: #EDDDB8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 500;
        }

        /* Pembungkus Jendela (Masking / Topeng Pemotong) */
        .iframe-container {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden !important;
            
            /* Lapisan kaca dalam frame diisolasi dengan batas putih tipis terpadu */
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 254, 0.3);
            
            height: 83px;
            --crop-left: -50px;
            --crop-top: -135px;
        }

        /* Aplikasi Target yang Dibungkus */
        iframe {
            position: absolute;
            width: 480px;
            height: 445px;
            border: none;
            overflow: hidden !important;
            touch-action: none;
            left: var(--crop-left);
            top: var(--crop-top);
        }

        /* KONFIGURASI AREA TEKS BARU DI BAWAH KARTU (TINGGI TETAP 10 BARIS) */
        .info-text-container {
            width: 373px; 
            height: 352px;
            overflow-y: auto; 
            overflow-x: hidden;
            text-align: justify; 
            font-size: 16px;
            
            /* PERUBAHAN: Mengubah jarak antar baris teks menjadi lebih rapat (1.3) */
            line-height: 1.3; 
            
            /* Warna teks informasi menggunakan tone White Gold lembut */
            color: #FFFFF4;
            word-wrap: break-word;
            white-space: normal;
            padding: 0 15px; 
            box-sizing: border-box; 
            user-select: text;
            touch-action: pan-y;
        }

        /* Mengatur keselarasan margin paragraf agar tetap rapi */
        .info-text-container p {
            margin: 0 0 4px 0; 
            
            /* PERUBAHAN: Menyesuaikan min-height baris kosong agar mengikuti line-height 1.3 (16px * 1.3 = 20.8px) */
            min-height: 20.8px;
        }

        .info-text-container p:last-child {
            margin-bottom: 0;
        }

        /* Modifikasi tampilan scrollbar agar terlihat minimalis dan modern */
        .info-text-container::-webkit-scrollbar {
            width: 4px;
        }

        .info-text-container::-webkit-scrollbar-thumb {
            /* Scrollbar menggunakan aksen warna emas redup */
            background: #CAA347;
            border-radius: 10px;
        }

        /* Gaya Khusus untuk Teks Tambahan @dev.afcom */
        .dev-tag {
            text-align: center;
            font-size: 13px;
            /* Menggunakan warna emas muda pudar */
            color: #EDDDB8;
            margin-top: 15px;
            width: 373px;
            font-weight: 400;
            letter-spacing: 0.5px;
            user-select: none;
        }
    </style>
</head>
<body>

    <!-- Kartu Pemutar Utama -->
    <div class="player-card">
        <div class="logo-placeholder">رَائِس</div>
        <h2 class="station-title">Radio Islam Sragen</h2>
        <p class="station-sub">Lantunan Murotal dan Kajian Islam Ilmiah</p>
        
        <div class="iframe-container" style="margin-bottom: 20px;">
            <iframe src="https://radioislam.my.id" allow="autoplay; encrypted-media" scrolling="no" title="Streamy Player"></iframe>
        </div>

        <!-- AREA TEKS SEKARANG DI MASUKKAN KE DALAM KARTU PEMUTAR BAGIAN BAWAH -->
        <div class="info-text-container">
            <p>══════📻🆁🅰🅸🆂</p>
            <p></p>
            <p>📚 Qasidah</p> <!-- Baris kosong ke-3 (ikut menyempit secara presisi) -->
            <p>   Unwanulhikam</p> <!-- Baris kosong ke-4 -->
            <p>🎙 Al-Ustadz&nbsp; Usamah&nbsp; bin</p> <!-- Baris kosong ke-5 -->
            <p>   Faishol Mahri&nbsp; حفظه ا لله</p> <!-- Baris kosong ke-6 -->
            <p></p> <!-- Baris kosong ke-7 -->
            <p>📚 Tausiyah</p> <!-- Baris kosong ke-8 -->
            <p>🎙 Al-Ustadz Huda حفظه ا لله</p> <!-- Baris kosong ke-8 -->
            <p></p> <!-- Baris kosong ke-8 -->            
            <p>📌 Masjid Alfalah,&nbsp;Sragen</p> <!-- Baris kosong ke-9 -->
            <p>   Ahad Tgl 20 Juli  2025</p> <!-- Baris kosong ke-10 -->
            <p></p> <!-- Baris kosong ke-11 -->
            <p></p>
        </div>

        <!-- TEKS BARU @dev.afcom JUGA DI DALAM KARTU -->
        <div class="dev-tag">
            dev.@fcom
        </div>
    </div>

    <script>
        // Mengizinkan scroll internal hanya untuk kontainer teks bawah agar PWA tidak kaku
        document.addEventListener('touchmove', function(e) {
            if (e.target.closest('.info-text-container')) {
                return;
            }
            if (e.scale !== 1) {
                e.preventDefault();
            }
        }, { passive: false });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('PWA Manual Crop Sukses Diaktifkan!'))
                    .catch(err => console.log('PWA Gagal:', err));
            });
        }
    </script>
</body>
</html>
