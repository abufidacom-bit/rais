<!DOCTYPE html>
<html lang="id">
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"> 
    <title>Radio Islam Sragen</title> 
    <!-- Hubungkan ke file Manifest PWA --> 
    <link rel="manifest" href="manifest.json"> 
    <meta name="theme-color" content="#1b4d3e"> 
    
    <!-- Ikon Pelindung untuk iOS Safari -->
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
    
    <!-- Pengaturan Khusus PWA Standalone --> 
    <meta name="apple-mobile-web-app-capable" content="yes"> 
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> 
    <style> 
        /* KUNCI LAYAR UTAMA ANTI-SCROLL */ 
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #121212; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            padding-top: 5vh; /* Jarak aman vertikal atas */
            overflow: hidden !important; 
            position: fixed; 
            touch-action: none; 
            user-select: none; 
            box-sizing: border-box; 
        } 
        
        /* Kartu Pemutar yang Dikunci Dimensinya agar Mencegah Efek Full Page AzuraCast */ 
        .player-card { 
            background: #1e1e1e; 
            padding: 22px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            text-align: center; 
            width: 330px; /* Ukuran lebar dikunci rapat */
            border-top: 5px solid #1b4d3e; 
            box-sizing: border-box; 
            touch-action: none; 
        } 
        
        .logo-image { 
            width: 75px; 
            height: 75px; 
            border-radius: 50%; 
            margin: 0 auto 10px; 
            display: block;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(27, 77, 62, 0.4); 
            border: 2px solid #1b4d3e;
        } 
        
        .station-title { 
            margin: 5px 0; 
            font-size: 21px; 
            color: #e0e0e0; 
        } 
        
        .station-sub { 
            margin: 0 0 15px 0; 
            font-size: 13px; 
            color: #888; 
        } 
        
        /* FIX PENYUSUTAN DIMENSI FRAME: Dikunci ke 300px untuk meredam responsif breakout server */ 
        .iframe-container { 
            width: 100%; 
            height: 300px; 
            border-radius: 12px; 
            overflow: hidden !important; 
            background: #151515; 
            border: 1px solid #2d2d2d; 
            position: relative; 
        } 
        
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            overflow: hidden !important; 
            touch-action: none; 
        } 
    </style>
</head>
<body>
    <div class="player-card"> 
        <img src="icon-192.png" alt="Logo Radio Islam Sragen" class="logo-image" onerror="this.src='icon-512.png'">
        <h2 class="station-title">Radio Islam Sragen</h2> 
        <p class="station-sub">sragen.radioislam.my.id</p> 
        <div class="iframe-container"> 
            <iframe src="https://radioislam.my.id" allow="autoplay; encrypted-media" scrolling="no" title="Streamy Player"> </iframe> 
        </div> 
    </div>

    <script> 
        document.addEventListener('touchmove', function(e) { 
            if (e.scale !== 1) { e.preventDefault(); } 
        }, { passive: false }); 

        if ('serviceWorker' in navigator) { 
            window.addEventListener('load', () => { 
                navigator.serviceWorker.register('sw.js') 
                    .then(reg => console.log('PWA Card Mode Aktif!')) 
                    .catch(err => console.log('PWA Gagal:', err)); 
            }); 
        }
    </script>
</body>
</html>
