<script>
    // Alamat URL streaming asli Radio Islam Sragen
    const STREAM_URL = "http://radioislam.my.id"; 
    
    const playBtn = document.getElementById('play-btn');
    const statusText = document.getElementById('status-text');
    
    // Variabel global untuk menyimpan referensi jendela radio
    let radioWindow = null; 
    let isPlaying = false;

    playBtn.addEventListener('click', () => {
        if (!isPlaying) {
            statusText.innerText = "Membuka saluran radio...";
            
            // Pengaturan agar pop-up berukuran kecil (320x160 piksel) seperti widget pemutar audio
            const windowFeatures = "width=320,height=160,resizable=no,scrollbars=no,status=no,menubar=no,toolbar=no";
            
            // Membuka aliran HTTP langsung di jendela tersendiri (Bypass proteksi HTTPS browser)
            radioWindow = window.open(STREAM_URL, "RadioIslamSragenPlayer", windowFeatures);
            
            if (radioWindow) {
                isPlaying = true;
                playBtn.innerText = "HENTIKAN";
                playBtn.style.background = "#b33939"; // Berubah warna menjadi merah hangat
                statusText.innerText = "Menyiarkan Audio Live (Jendela Terbuka)";
            } else {
                statusText.innerText = "Gagal memutar. Izinkan izin 'Pop-up' di browser Anda.";
            }
            
        } else {
            // Jika tombol di PWA ditekan kembali saat memutar, jendela streaming otomatis ditutup
            if (radioWindow && !radioWindow.closed) {
                radioWindow.close();
            }
            isPlaying = false;
            playBtn.innerText = "PUTAR";
            playBtn.style.background = "#1b4d3e"; // Kembali ke warna hijau gelap semula
            statusText.innerText = "Streaming dihentikan";
        }
    });

    // Fitur Tambahan: Jika pendengar menutup jendela kecil radio secara manual, tombol PWA otomatis reset ke "PUTAR"
    setInterval(() => {
        if (isPlaying && radioWindow && radioWindow.closed) {
            isPlaying = false;
            playBtn.innerText = "PUTAR";
            playBtn.style.background = "#1b4d3e";
            statusText.innerText = "Streaming dihentikan oleh pendengar";
        }
    }, 1000);

    // DAFTARKAN SERVICE WORKER PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('PWA Radio Islam Sragen Aktif!'))
                .catch(err => console.log('PWA Gagal:', err));
        });
    }
</script>
