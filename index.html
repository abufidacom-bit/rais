<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Islam Sragen</title>
    <!-- Hubungkan ke file Manifest PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1b4d3e">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .player-card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            width: 290px;
            border-top: 5px solid #1b4d3e;
        }
        .logo-placeholder {
            width: 120px;
            height: 120px;
            background: #1b4d3e;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 0 20px rgba(27, 77, 62, 0.5);
        }
        .station-title {
            margin: 10px 0 5px 0;
            font-size: 22px;
            color: #e0e0e0;
        }
        .station-sub {
            margin: 0 0 20px 0;
            font-size: 14px;
            color: #888;
        }
        .btn-play {
            background: #1b4d3e;
            border: none;
            color: white;
            padding: 14px 40px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn-play:hover { 
            background: #256b57; 
            transform: scale(1.03);
        }
        .status { 
            margin-top: 20px; 
            color: #a0a0a0; 
            font-size: 14px; 
            font-style: italic;
            line-height: 1.4;
        }
        .btn-help {
            display: none;
            background: none;
            border: 1px solid #ffb703;
            color: #ffb703;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 4px;
            margin: 15px auto 0 auto;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-help:hover {
            background: rgba(255, 183, 3, 0.1);
        }
    </style>
</head>
<body>

<div class="player-card">
    <div class="logo-placeholder">🕌</div>
    <h2 class="station-title">Radio Islam Sragen</h2>
    <p class="station-sub">sragen.radioislam.my.id</p>
    
    <!-- AUDIO ELEMENT STANDARD -->
    <audio id="audio-player" preload="none" crossorigin="anonymous"></audio>

    <button class="btn-play" id="play-btn">PUTAR</button>
    <p class="status" id="status-text">Siap mendengarkan kajian</p>
    <button class="btn-help" id="help-btn" onclick="showInstructions()">Cara Mengaktifkan Suara</button>
</div>

<script>
    // URL format Shoutcast langsung
    const STREAM_URL = "http://radioislam.my.id"; 
    
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const statusText = document.getElementById('status-text');
    const helpBtn = document.getElementById('help-btn');
    let isPlaying = false;

    playBtn.addEventListener('click', () => {
        if (!isPlaying) {
            statusText.innerText = "Menghubungkan ke server...";
            helpBtn.style.display = "none";
            
            // Bypass cache agar selalu memuat siaran paling baru
            audio.src = STREAM_URL + "?ts=" + Date.now();
            
            audio.play()
                .then(() => {
                    isPlaying = true;
                    playBtn.innerText = "HENTIKAN";
                    playBtn.style.background = "#b33939";
                    statusText.innerText = "Memutar Audio Streaming Live";
                })
                .catch(err => {
                    isPlaying = false;
                    playBtn.innerText = "PUTAR";
                    playBtn.style.background = "#1b4d3e";
                    statusText.innerHTML = "Gagal memuat suara.<br><span style='color:#ffb703; font-size:12px;'>Diblokir oleh proteksi keamanan Browser.</span>";
                    helpBtn.style.display = "block"; // Munculkan tombol bantuan secara halus
                    console.error("Error Detail:", err);
                });
        } else {
            audio.pause();
            audio.src = ""; // Memotong koneksi internet secara total
            isPlaying = false;
            playBtn.innerText = "PUTAR";
            playBtn.style.background = "#1b4d3e";
            statusText.innerText = "Streaming dihentikan";
            helpBtn.style.display = "none";
        }
    });

    function showInstructions() {
        alert("Agar suara kajian bisa keluar, silakan:\n\n1. Klik ikon Pengaturan Situs / Gembok di sebelah kiri alamat URL web ini (bagian atas browser).\n2. Pilih 'Pengaturan Situs' (Site Settings).\n3. Cari menu 'Konten tidak aman' (Insecure content).\n4. Ubah opsinya menjadi 'Izinkan' (Allow).\n5. Buka kembali halaman ini dan segarkan (refresh).");
    }

    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('PWA Radio Islam Sragen Aktif!'))
                .catch(err => console.log('PWA Gagal:', err));
        });
    }
</script>
</body>
</html>
