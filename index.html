<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radio Islam Sragen</title>
    <!-- Hubungkan ke file Manifest PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1b4d3e">
    
    <!-- Pengaturan Khusus Apple iOS Mobile Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RI Sragen">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #121212;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        /* Pembungkus Frame Utama Mengisi Seluruh Layar PWA */
        .app-container {
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Memuat Halaman HTTPS Resmi Streamy Anda Secara Penuh -->
    <iframe 
        src="https://radioislam.my.id" 
        allow="autoplay; encrypted-media; clipboard-write"
        sandbox="allow-same-origin allow-scripts allow-forms allow-popups"
        title="Radio Islam Sragen Live Player">
    </iframe>
</div>

<script>
    // DAFTARKAN SERVICE WORKER PWA AGAR BISA DIINSTAL DI HP
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('PWA Frame Radio Islam Sragen Aktif Sempurna!'))
                .catch(err => console.log('PWA Gagal:', err));
        });
    }
</script>
</body>
</html>
