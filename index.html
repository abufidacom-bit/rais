<!DOCTYPE html>
<html lang="id">
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"> 
    <title>Radio Islam Sragen</title> 
    <!-- Hubungkan ke file Manifest PWA --> 
    <link rel="manifest" href="manifest.json"> 
    <meta name="theme-color" content="#1b4d3e"> 
    <!-- Pengaturan Khusus iOS/Safari PWA Standalone --> 
    <meta name="apple-mobile-web-app-capable" content="yes"> 
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> 
    <style> 
        /* KUNCI TOTAL LAYAR UTAMA: Mencegah halaman ditarik/digeser ke atas-bawah oleh jari */ 
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #121212; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            /* Mengatur perataan agar posisi terangkat aman ke bagian atas layar HP */ 
            justify-content: flex-start; 
            padding-top: 4vh; 
            overflow: hidden !important; /* Menghapus bar scroll secara mutlak */ 
            position: fixed; /* Mengunci posisi layar dari efek bounce elastis iOS */ 
            touch-action: none; /* Mematikan semua gerakan geser jari pada latar belakang */ 
            user-select: none; /* Mencegah teks terblok atau tersorot secara tidak sengaja */ 
            box-sizing: border-box; 
        } 
        /* Kartu Pemutar Terkunci Presisi & Diperbesar Mengikuti Ukuran Player Baru */ 
        .player-card { 
            background: #1e1e1e; 
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            text-align: center; 
            width: 340px; /* Diperlebar sedikit agar komponen player lebih lega */ 
            border-top: 5px solid #1b4d3e; 
            box-sizing: border-box; 
            touch-action: none; /* Kunci kartu agar tidak ikut bergeser saat interaksi */ 
        } 
        .logo-placeholder { 
            width: 80px; 
            height: 80px; 
            background: #1b4d3e; 
            border-radius: 50%; 
            margin: 0 auto 12px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 32px; 
            box-shadow: 0 0 20px rgba(27, 77, 62, 0.4); 
        } 
        .station-title { 
            margin: 5px 0; 
            font-size: 22px; 
            color: #e0e0e0; 
        } 
        .station-sub { 
            margin: 0 0 15px 0; 
            font-size: 13px; 
            color: #888; 
        } 
        /* Pembungkus Frame: Ukuran Lapang Agar Player Streamy Tampil Utuh */ 
        .iframe-container { 
            width: 100%; 
            height: 320px; /* Dipertahankan 320px agar sistem sensitif Streamy tidak pecah */ 
            border-radius: 12px; 
            overflow: hidden !important; /* Blokir bar scroll kontainer */ 
            position: relative; 
            
            /* MODIFIKASI: Mengubah latar belakang frame menjadi Putih dan garis tepi abu terang */ 
            background: #ffffff; 
            border: 1px solid #e0e0e0; 
            
            /* MEMPERTAHANKAN: Jarak padding 25px pada atas, kanan, kiri */ 
            padding: 25px 25px 0px 25px; 
            box-sizing: border-box; 
        } 
        /* Mengunci Pergerakan di Dalam Iframe */ 
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            overflow: hidden !important; /* Blokir bar scroll halaman target */ 
            touch-action: none; /* Mematikan geser/scroll di dalam area iframe */ 
        } 
    </style>
</head>
<body>
    <div class="player-card"> 
        <div class="logo-placeholder">🇲🇨</div> 
        <h2 class="station-title">Radio Islam Sragen</h2> 
        <p class="station-sub">sragen.radioislam.my.id</p> 
        <!-- Wadah Iframe Baru yang Lebih Lapang untuk Mengunci Player Sragen --> 
        <div class="iframe-container"> 
            <iframe src="https://streamy1.radioislam.my.id/player/sragen-s-station/" allow="autoplay; encrypted-media" scrolling="no" title="Streamy Player"> </iframe> 
        </div> 
    </div>

    <script> 
        // Mematikan efek geser elastis (overscroll) di webview seluler secara paksa via JavaScript 
        document.addEventListener('touchmove', function(e) { 
            if (e.scale !== 1) { e.preventDefault(); } 
        }, { passive: false }); 

        // DAFTARKAN SERVICE WORKER PWA AGAR BISA DIINSTAL DI HP 
        if ('serviceWorker' in navigator) { 
            window.addEventListener('load', () => { 
                navigator.serviceWorker.register('sw.js') 
                    .then(reg => console.log('PWA Frame Lapang Sukses Diaktifkan!')) 
                    .catch(err => console.log('PWA Gagal:', err)); 
            }); 
        }
    </script>
</body>
</html>
