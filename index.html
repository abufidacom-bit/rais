<!DOCTYPE html>
<html lang="id">
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"> 
    <title>Radio Islam Sragen</title> 
    <!-- Hubungkan ke file Manifest PWA --> 
    <link rel="manifest" href="manifest.json"> 
    <meta name="theme-color" content="#1b4d3e"> 
    
    <!-- Pengaturan Khusus iOS/Safari PWA Standalone --> 
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
    <meta name="apple-mobile-web-app-capable" content="yes"> 
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> 
    <style> 
        /* KUNCI TOTAL LAYAR UTAMA: Mencegah halaman ditarik/digeser ke atas-bawah oleh jari */ 
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #121212; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            padding-top: 4vh; 
            overflow: hidden !important; /* Menghapus bar scroll secara mutlak */ 
            position: fixed; /* Mengunci posisi layar dari efek bounce elastis iOS */ 
            touch-action: none; /* Mematikan semua gerakan geser jari pada latar belakang */ 
            user-select: none; /* Mencegah teks terblok atau tersorot secara tidak sengaja */ 
            box-sizing: border-box; 
        } 
        /* Kartu Pemutar Terkunci Presisi & Disesuaikan proporsinya */ 
        .player-card { 
            background: #1e1e1e; 
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            text-align: center; 
            width: 360px; /* Diperlebar ke 360px agar pas dengan lebar asli pemutar Streamy */ 
            border-top: 5px solid #1b4d3e; 
            box-sizing: border-box; 
            touch-action: none; /* Kunci kartu agar tidak ikut bergeser saat interaksi */ 
        } 
        .logo-image { 
            width: 85px; 
            height: 85px; 
            border-radius: 50%; 
            margin: 0 auto 12px; 
            display: block;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(27, 77, 62, 0.4); 
            border: 2px solid #1b4d3e;
        } 
        .station-title { 
            margin: 5px 0; 
            font-size: 22px; 
            color: #e0e0e0; 
        } 
        .station-sub { 
            margin: 0 0 15px 0; 
            font-size: 13px; 
            color: #888; 
        } 
        /* SOLUSI ADAPTIF FRAME: Tinggi dinaikkan menjadi 380px agar pas dengan tinggi render standar server */ 
        .iframe-container { 
            width: 100%; 
            height: 380px; 
            border-radius: 12px; 
            overflow: hidden !important; /* Blokir bar scroll kontainer */ 
            background: #151515; 
            border: 1px solid #2d2d2d; 
            position: relative; 
        } 
        /* Mengunci Pergerakan di Dalam Iframe */ 
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            overflow: hidden !important; /* Blokir bar scroll halaman target */ 
            touch-action: none; /* Mematikan geser/scroll di dalam area iframe */ 
        } 
    </style>
</head>
<body>
    <div class="player-card"> 
        <img src="icon-192.png" alt="Logo Radio Islam Sragen" class="logo-image" onerror="this.src='icon-512.png'">
        <h2 class="station-title">Radio Islam Sragen</h2> 
        <p class="station-sub">sragen.radioislam.my.id</p> 
        <!-- Wadah Iframe dengan Ukuran Adaptif yang Dioptimalkan --> 
        <div class="iframe-container"> 
            <!-- Menggunakan parameter ?embed=true murni agar server mengunci antarmuka pemutar resmi -->
            <iframe src="https://radioislam.my.id" allow="autoplay; encrypted-media" scrolling="no" title="Streamy Player"> </iframe> 
        </div> 
    </div>

    <script> 
        // Mematikan efek geser elastis (overscroll) di webview seluler secara paksa via JavaScript 
        document.addEventListener('touchmove', function(e) { 
            if (e.scale !== 1) { e.preventDefault(); } 
        }, { passive: false }); 

        // DAFTARKAN SERVICE WORKER PWA AGAR BISA DIINSTAL DI HP 
        if ('serviceWorker' in navigator) { 
            window.addEventListener('load', () => { 
                navigator.serviceWorker.register('sw.js') 
                    .then(reg => console.log('PWA Frame Adaptif Sukses Diaktifkan!'))
                    .catch(err => console.log('PWA Gagal:', err)); 
            }); 
        }
    </script>
</body>
</html>
