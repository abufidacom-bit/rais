<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Islam Sragen</title>
    <!-- Hubungkan ke file Manifest PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .player-card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            width: 280px;
        }
        .logo-placeholder {
            width: 150px;
            height: 150px;
            background: #2a2a2a;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border: 4px solid #00adb5;
        }
        .btn-play {
            background: #00adb5;
            border: none;
            color: white;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-play:hover { background: #008c95; }
        .status { margin-top: 15px; color: #888; font-size: 14px; }
    </style>
</head>
<body>

<div class="player-card">
    <div class="logo-placeholder">RADIO</div>
    <h2>Ikhwah Plupuh</h2>
    <p class="status" id="status-text">Siap Memutar</p>
    <button class="btn-play" id="play-btn">PLAY</button>
</div>

<script>
    // MASUKKAN URL STREAMING ANDA DI SINI
    const STREAM_URL = "http://sragen.radioislam.my.id:11252/"; 
    
    const audio = new Audio();
    audio.crossOrigin = "anonymous";
    const playBtn = document.getElementById('play-btn');
    const statusText = document.getElementById('status-text');
    let isPlaying = false;

    playBtn.addEventListener('click', () => {
        if (!isPlaying) {
            statusText.innerText = "Menghubungkan...";
            audio.src = STREAM_URL;
            audio.play()
                .then(() => {
                    isPlaying = true;
                    playBtn.innerText = "STOP";
                    statusText.innerText = "Memutar Siaran Live";
                })
                .catch(err => {
                    statusText.innerText = "Gagal Memuat Stream";
                    console.error(err);
                });
        } else {
            audio.pause();
            audio.src = ""; // Memutus koneksi streaming agar hemat kuota
            isPlaying = false;
            playBtn.innerText = "PLAY";
            statusText.innerText = "Dihentikan";
        }
    });

    // MENGAKTIFKAN FITUR PWA (SERVICE WORKER)
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('PWA Siap!'))
                .catch(err => console.log('PWA Gagal:', err));
        });
    }
</script>
</body>
</html>
