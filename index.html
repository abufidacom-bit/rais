<script>
    // PENULISAN URL FORMAT SHOUTCAST YANG BENAR UNTUK BROWSER WEB
    // Menambahkan titik koma (;) wajib hukumnya bagi server Shoutcast agar langsung memancarkan audio mentah
    const STREAM_URL = "http://streamy1.radioislam.my.id:9210/;"; 
    
    const playBtn = document.getElementById('play-btn');
    const statusText = document.getElementById('status-text');
    
    let radioWindow = null; 
    let isPlaying = false;

    playBtn.addEventListener('click', () => {
        if (!isPlaying) {
            statusText.innerText = "Membuka saluran radio...";
            
            // Membuat jendela pop-up berukuran kecil layaknya widget mini player
            const windowFeatures = "width=340,height=180,resizable=no,scrollbars=no,status=no,menubar=no,toolbar=no";
            
            // Membuka aliran audio langsung di jendela terpisah untuk melewati proteksi HTTPS browser
            radioWindow = window.open(STREAM_URL, "RadioIslamSragenPlayer", windowFeatures);
            
            if (radioWindow) {
                isPlaying = true;
                playBtn.innerText = "HENTIKAN";
                playBtn.style.background = "#b33939"; // Berubah warna menjadi merah
                statusText.innerText = "Menyiarkan Audio Live (Jendela Terbuka)";
            } else {
                // Notifikasi ini muncul jika browser bawaan memblokir pop-up secara otomatis
                statusText.innerText = "Gagal memutar. Harap IZINKAN izin 'Pop-up' di browser Anda.";
            }
            
        } else {
            // Menutup jendela streaming secara otomatis saat tombol HENTIKAN ditekan
            if (radioWindow && !radioWindow.closed) {
                radioWindow.closed = false; // Reset status browser
                radioWindow.close();
            }
            isPlaying = false;
            playBtn.innerText = "PUTAR";
            playBtn.style.background = "#1b4d3e"; // Kembali ke warna hijau semula
            statusText.innerText = "Streaming dihentikan";
        }
    });

    // Fitur sinkronisasi otomatis: Jika pendengar menutup jendela radio secara manual, tombol PWA otomatis kembali ke "PUTAR"
    setInterval(() => {
        if (isPlaying && radioWindow && radioWindow.closed) {
            isPlaying = false;
            playBtn.innerText = "PUTAR";
            playBtn.style.background = "#1b4d3e";
            statusText.innerText = "Streaming dihentikan oleh pendengar";
        }
    }, 1000);

    // DAFTARKAN SERVICE WORKER PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('PWA Radio Islam Sragen Aktif!'))
                .catch(err => console.log('PWA Gagal:', err));
        });
    }
</script>
